<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#a18cd1);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

.card{
    width:90%;
    max-width:420px;
    padding:35px 25px;
    text-align:center;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:30px;
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

h1{
    font-size:38px;
    margin-bottom:15px;
}

.name{
    font-size:45px;
    font-weight:bold;
    background:linear-gradient(90deg,#fff,#ffe0f0,#fff);
    background-size:200%;
    color:transparent;
    background-clip:text;
    animation:shine 3s infinite;
}

@keyframes shine{
    0%{background-position:0%}
    100%{background-position:200%}
}

.cake{
    font-size:90px;
    margin:20px 0;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    50%{transform:translateY(-12px);}
}

p{
    font-size:17px;
    line-height:1.6;
    margin:15px 0;
}

button{
    border:none;
    padding:14px 28px;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    color:#ff4f81;
    background:white;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
}

#message{
    display:none;
    margin-top:20px;
    animation:fade 1s;
}

@keyframes fade{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

.heart{
    position:absolute;
    bottom:-30px;
    animation:float 6s linear infinite;
    font-size:25px;
}

@keyframes float{
    0%{
        transform:translateY(0) rotate(0);
        opacity:1;
    }
    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="card">

    <div style="font-size:25px;">🎉✨🎈</div>

    <h1>Happy Birthday</h1>

    <div class="name">Swati 💖</div>

    <div class="cake">🎂</div>

    <p>
        Today is a very special day because  
        someone amazing was born! 🥳
    </p>

    <button onclick="showMessage()">
        🎁 Open Your Surprise
    </button>

    <div id="message">
        <h2>💝 A Special Message 💝</h2>

        <p>
            May your birthday be filled with
            happiness, beautiful memories,
            endless smiles and lots of love. 🌸✨
        </p>

        <p>
            Keep smiling and keep shining! 🌟
        </p>

        <div style="font-size:45px;">
            🎂 🎁 💖 🥳
        </div>
    </div>

</div>

<script>

function showMessage(){

    document.getElementById("message").style.display="block";

    for(let i=0;i<25;i++){

        let heart=document.createElement("div");

        heart.className="heart";
        heart.innerHTML=["💖","💕","💗","✨","🎈"][Math.floor(Math.random()*5)];

        heart.style.left=Math.random()*100+"%";
        heart.style.animationDuration=(3+Math.random()*4)+"s";
        heart.style.fontSize=(18+Math.random()*25)+"px";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },7000);
    }
}

</script>

</body>
</html>
